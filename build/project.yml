# project.yml
# XcodeGen configuration for the AetherEngine iOS application.
# Uses pre-built libaether_engine.a (from CMake) — engine C files are NOT
# recompiled by Xcode, avoiding double-build and warning conflicts.
# AetherEngine-iOS · Clean-room.

name: AetherApp
options:
  bundleIdPrefix: com.muntazirfx.aether
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "15.4"
  objectVersion: 56

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: c11
    # Silence C warnings that don't apply to pre-built engine
    GCC_WARN_UNUSED_FUNCTION: NO
    GCC_WARN_UNUSED_VARIABLE: NO
    GCC_WARN_UNUSED_VALUE: NO
    GCC_WARN_SIGN_COMPARE: NO
    CLANG_WARN_STRICT_PROTOTYPES: NO
    CLANG_WARN_SHORTEN_64_TO_32: NO
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../engine/core"
      - "$(SRCROOT)/../engine/game"
      - "$(SRCROOT)/../engine/input"
      - "$(SRCROOT)/../engine/config"
      - "$(SRCROOT)/../engine/fs"
      - "$(SRCROOT)/../engine/audio"
      - "$(SRCROOT)/../engine/render"
    SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/../ios/AetherApp/Bridging-Header.h"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO

targets:
  AetherApp:
    type: application
    platform: iOS
    sources:
      # ONLY iOS Swift/ObjC sources — engine C files are linked, not recompiled
      - path: ../ios/AetherApp
    dependencies:
      # Pre-built engine static library from CMake step
      - framework: out/cmake-ios/libaether_engine.a
        embed: false
        link: true
    settings:
      base:
        INFOPLIST_FILE: configs/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.muntazirfx.aether.app
        PRODUCT_NAME: AetherEngine
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ONLY_ACTIVE_ARCH: NO
        VALID_ARCHS: arm64
        ARCHS: arm64
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          GCC_OPTIMIZATION_LEVEL: "s"
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          GCC_OPTIMIZATION_LEVEL: "0"
    scheme:
      testTargets: []
      gatherCoverageData: false
