# verify.yml — Always-on host compile + smoke (required green).
# AetherEngine-iOS · Clean-room. No Xcode/macOS required.

name: Verify Host

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify_host:
    name: verify_host (compile + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cc --version | head -1
          uname -a

      - name: Run verify_host.sh
        run: bash build/scripts/verify_host.sh
