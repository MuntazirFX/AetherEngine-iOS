name: Build ARM64 IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  XCODE_VERSION: "15.4"
  XCODEGEN_VERSION: "2.42.0"
  CMAKE_VERSION: "3.29.6"

jobs:
  build-arm64:
    name: Build ARM64 iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Show toolchain versions
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          echo "=== Swift ==="
          swift --version
          echo "=== Host arch ==="
          uname -m

      - name: Install CMake
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Make build scripts executable
        run: |
          chmod +x build/scripts/build_ios.sh
          chmod +x build/scripts/package_ipa.sh

      - name: Sanity compile engine (host)
        run: |
          set -euo pipefail
          mkdir -p /tmp/sanity
          cd /tmp/sanity
          for f in \
            "$GITHUB_WORKSPACE/engine/core/AetherCore.c" \
            "$GITHUB_WORKSPACE/engine/core/AetherEngine.c" \
            "$GITHUB_WORKSPACE/engine/core/AetherMath.c" \
            "$GITHUB_WORKSPACE/engine/core/AetherArray.c" \
            "$GITHUB_WORKSPACE/engine/core/AetherEvent.c" \
            "$GITHUB_WORKSPACE/engine/core/AetherGameManager.c" \
            "$GITHUB_WORKSPACE/engine/game/AetherManifest.c" \
            "$GITHUB_WORKSPACE/engine/input/AetherInput.c" \
            "$GITHUB_WORKSPACE/engine/input/AetherTouch.c" \
            "$GITHUB_WORKSPACE/engine/config/AetherSettings.c" \
            "$GITHUB_WORKSPACE/engine/fs/AetherFS.c" \
            "$GITHUB_WORKSPACE/engine/fs/AetherPAK.c" \
            "$GITHUB_WORKSPACE/engine/audio/AetherAudio.c" \
            "$GITHUB_WORKSPACE/engine/render/AetherRender.c" \
          ; do
            echo "→ cc -c $f"
            cc -std=c11 -Wall -Wextra -Wno-unused-parameter \
              -I"$GITHUB_WORKSPACE/engine/core" \
              -I"$GITHUB_WORKSPACE/engine/game" \
              -I"$GITHUB_WORKSPACE/engine/input" \
              -I"$GITHUB_WORKSPACE/engine/config" \
              -I"$GITHUB_WORKSPACE/engine/fs" \
              -I"$GITHUB_WORKSPACE/engine/audio" \
              -I"$GITHUB_WORKSPACE/engine/render" \
              -c "$f" -o "$(basename "$f" .c).o"
          done
          echo "✔ Sanity compile passed"

      - name: Build iOS app (unsigned)
        run: bash build/scripts/build_ios.sh

      - name: Package unsigned IPA
        run: bash build/scripts/package_ipa.sh

      - name: Verify IPA
        run: |
          set -euo pipefail
          IPA_PATH="build/out/AetherEngine.ipa"
          test -f "$IPA_PATH" || (echo "IPA missing!" && exit 1)
          echo "IPA size:"
          ls -lh "$IPA_PATH"
          echo "Contents:"
          unzip -l "$IPA_PATH" | head -n 30

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AetherEngine-IPA-${{ github.sha }}
          path: build/out/AetherEngine.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload engine static library
        uses: actions/upload-artifact@v4
        with:
          name: libaether_engine-${{ github.sha }}
          path: build/out/cmake-ios/**/libaether_engine.a
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build/out/DerivedData/Logs/
            build/out/cmake-ios/CMakeFiles/CMakeOutput.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "### AetherEngine-iOS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** macOS 14 (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** iOS 14+, ARM64" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing:** Disabled (unsigned IPA)" >> $GITHUB_STEP_SUMMARY
          if [ -f build/out/AetherEngine.ipa ]; then
            echo "- **IPA size:** $(du -sh build/out/AetherEngine.ipa | cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** ✅ Build succeeded" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** ❌ Build failed" >> $GITHUB_STEP_SUMMARY
          fi
