# build-arm64.yml
# PR/push: verify_host on macos-14 (sanity). workflow_dispatch: unsigned IPA.
# AetherEngine-iOS · Clean-room.

name: Build AetherEngine IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v0.1.0)'
        required: true
        type: string
      publish_release:
        description: 'Publish as GitHub Release?'
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - 'engine/**'
      - 'ios/**'
      - 'build/**'
      - '.github/workflows/build-arm64.yml'
      - 'tests/**'

permissions:
  contents: write

jobs:
  verify_host:
    name: verify_host (macos)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Host compile + smoke
        run: bash build/scripts/verify_host.sh

  build_ipa:
    name: Unsigned IPA (dispatch only)
    needs: []
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          swift --version
          uname -m
      - name: Install CMake
        run: |
          if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version
      - name: Make build scripts executable
        run: |
          chmod +x build/scripts/build_ios.sh build/scripts/package_ipa.sh build/scripts/verify_host.sh build/scripts/cmake_host.sh 2>/dev/null || true
      - name: Host verify before IPA
        run: bash build/scripts/verify_host.sh
      - name: Build iOS app (unsigned)
        run: bash build/scripts/build_ios.sh
      - name: Package unsigned IPA
        run: bash build/scripts/package_ipa.sh
      - name: Verify IPA
        run: |
          set -euo pipefail
          IPA_PATH="build/out/AetherEngine.ipa"
          test -f "$IPA_PATH" || (echo "IPA missing!" && exit 1)
          ls -lh "$IPA_PATH"
      - name: Compute IPA metadata
        id: meta
        run: |
          IPA=build/out/AetherEngine.ipa
          SIZE=$(du -sh "$IPA" | cut -f1)
          SHA=$(shasum -a 256 "$IPA" | awk '{print $1}')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          VERSION="${{ github.event.inputs.version }}"
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "short=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherEngine-${{ github.event.inputs.version }}
          path: build/out/AetherEngine.ipa
          retention-days: 30
          if-no-files-found: error
      - name: Build release notes
        if: ${{ github.event.inputs.publish_release == 'true' }}
        run: |
          cat > /tmp/notes.md <<EOF
          ## AetherEngine-iOS — ${{ github.event.inputs.version }}
          **Built:** ${{ steps.meta.outputs.date }}
          - IPA size: ${{ steps.meta.outputs.size }}
          - SHA256: `${{ steps.meta.outputs.sha }}`
          - Commit: `${{ github.sha }}`
          No copyrighted assets bundled. Provide your own game data.
          EOF
      - name: Create GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "AetherEngine ${{ github.event.inputs.version }}"
          body_path: /tmp/notes.md
          files: build/out/AetherEngine.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        if: always()
        run: |
          echo "### AetherEngine IPA" >> $GITHUB_STEP_SUMMARY
          echo "- Event: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- verify_host: always (separate job on PR)" >> $GITHUB_STEP_SUMMARY
          echo "- IPA: workflow_dispatch only" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact upload: actions/upload-artifact@v4 (AetherEngine-<version>, 30d)" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact download: Actions UI → Artifacts, or: gh run download <run-id> -n AetherEngine-<version>" >> $GITHUB_STEP_SUMMARY
          echo "- Optional Release attach when publish_release=true" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: macos-14; unsigned IPA via build_ios.sh + package_ipa.sh" >> $GITHUB_STEP_SUMMARY
          echo "- Local dry-run: ./build/scripts/build_ios.sh && ./build/scripts/package_ipa.sh" >> $GITHUB_STEP_SUMMARY
          echo "- Sideload: AltStore / Sideloadly / TrollStore (no baked signing)" >> $GITHUB_STEP_SUMMARY
